<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soma's Meals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <!-- Cloud sync: Appwrite web SDK (exact pin, no build step) then the local
       config + adapter, all before script.js. All `defer` so a blocked/slow
       CDN never delays the first paint. -->
  <script src="https://cdn.jsdelivr.net/npm/appwrite@18.2.0/dist/iife/sdk.js" defer></script>
  <script src="config.js" defer></script>
  <script src="sync.js" defer></script>
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="board-head">
      <div>
        <p class="eyebrow">Kitchen board</p>
        <h1>Soma's Meals</h1>
      </div>
      <button type="button" class="account-chip" id="account-chip" data-state="signed-out" aria-haspopup="true" aria-expanded="false" hidden>
        <span class="chip-dot"></span><span id="chip-text">Sign in to sync</span>
      </button>
      <div class="account-menu" id="account-menu" hidden>
        <p class="menu-label">Signed in as</p>
        <p class="menu-email" id="menu-email"></p>
        <button type="button" class="menu-signout" id="signout-btn">Sign out</button>
      </div>
    </header>

    <section class="card lunch">
      <div class="card-head"><span class="meal-label"><span class="dot"></span>Lunch</span></div>
      <div class="row">
        <div class="bowl-wrap" id="bowl-lunch"></div>
        <div style="flex:1">
          <p class="order-by">Order by</p>
          <p class="order-date" id="orderdate-lunch">Loading…</p>
          <div class="tally-row" id="tally-lunch"></div>
        </div>
      </div>
      <div class="card-controls" hidden>
        <div class="divider"></div>
        <p class="error" id="error-lunch"></p>
        <div class="controls">
          <input type="number" id="meals-lunch" min="0" placeholder="Meals made">
          <button class="btn btn-add" onclick="calculate('lunch')">+ Add</button>
          <button class="btn btn-remove" onclick="removeMeals('lunch')">&minus;</button>
        </div>
      </div>
    </section>

    <section class="card dinner">
      <div class="card-head"><span class="meal-label"><span class="dot"></span>Dinner</span></div>
      <div class="row">
        <div class="bowl-wrap" id="bowl-dinner"></div>
        <div style="flex:1">
          <p class="order-by">Order by</p>
          <p class="order-date" id="orderdate-dinner">Loading…</p>
          <div class="tally-row" id="tally-dinner"></div>
        </div>
      </div>
      <div class="card-controls" hidden>
        <div class="divider"></div>
        <p class="error" id="error-dinner"></p>
        <div class="controls">
          <input type="number" id="meals-dinner" min="0" placeholder="Meals received">
          <button class="btn btn-add" onclick="calculate('dinner')">+ Add</button>
          <button class="btn btn-remove" onclick="removeMeals('dinner')">&minus;</button>
        </div>
      </div>
    </section>

    <p class="readonly-note" id="readonly-note" hidden>Read-only &mdash; counts from this device. Sign in to add, remove and sync.</p>

    <div class="sheet-scrim" id="sheet-scrim" hidden></div>
    <form class="signin-sheet" id="signin-sheet" hidden autocomplete="on">
      <div class="sheet-grabber"></div>
      <h2>Sync this board</h2>
      <p class="sheet-sub">Both of you see the same counts, live, on every device.</p>
      <p class="error" id="login-error"></p>
      <input type="email" id="login-email" placeholder="Email" autocomplete="username" required>
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit" class="sheet-submit" id="login-submit">Sign in</button>
      <button type="button" class="sheet-dismiss" id="sheet-dismiss">Keep using this device only</button>
    </form>
  </div>
</body>
</html>
